<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Instagram Clone</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background-color: #fff;
      display: flex;
      justify-content: center;
      padding: 20px;
    }

    .app {
      width: 400px;
    }

    /* HEADER */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #ddd;
    }

    .top-bar .logo img {
      height: 40px;
    }

    .top-bar .top-icons .icon {
      margin-left: 15px;
      cursor: pointer;
    }

    /* STORIES */
    .stories {
      display: flex;
      overflow-x: auto;
      padding: 10px 0;
      border-bottom: 1px solid #ddd;
    }

    .story {
      margin-right: 15px;
      text-align: center;
      font-size: 12px;
    }

    /* Story Ring */
    .story .story-ring {
      width: 64px;
      height: 64px;
      padding: 2px;
      border-radius: 50%;
      background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 5px;
    }

    .story img {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      border: 2px solid #fff; /* inner white border for effect */
    }

    /* POST */
    .post {
      margin-top: 20px;
      border: 1px solid #ddd;
      border-radius: 8px;
      overflow: hidden;
    }

    .post-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px;
    }

    .post-header .profile {
      display: flex;
      align-items: center;
    }

    .post-header .profile img {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      margin-right: 10px;
    }

    .post-header h4 {
      font-size: 14px;
      display: flex;
      align-items: center;
    }

    .post-header h4 i {
      margin-left: 5px;
      color: #0095f6;
    }

    .post-header span {
      font-size: 12px;
      color: #555;
    }

    .post-img {
      width: 100%;
      display: block;
    }

    .post-actions {
      display: flex;
      justify-content: space-between;
      padding: 10px;
      font-size: 20px;
    }

    .post-info {
      padding: 0 10px 10px;
      font-size: 14px;
    }

    .post-info .likes {
      font-weight: bold;
      margin-bottom: 5px;
    }

    .post-info .caption {
      margin-bottom: 5px;
    }

    .post-info .comments {
      color: #888;
      margin-bottom: 5px;
      cursor: pointer;
    }

    .post-info .time {
      color: #888;
      font-size: 12px;
    }

    /* BOTTOM NAV */
    .bottom-nav {
      display: flex;
      justify-content: space-around;
      padding: 10px 0;
      border-top: 1px solid #ddd;
      margin-top: 20px;
    }

    .bottom-nav .icon {
      cursor: pointer;
    }

  </style>
</head>
<body>
  <div class="app">
    <!-- HEADER -->
    <header class="top-bar">
      <div class="logo">
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/2/2a/Instagram_logo.svg/2560px-Instagram_logo.svg.png" alt="Instagram">
      </div>
      <div class="top-icons">
        <span class="icon">
          <i class="fa-regular fa-heart"></i>
        </span>
        <span class="icon">
          <i class="fa-brands fa-facebook-messenger"></i>
        </span>
      </div>
    </header>

    <!-- STORIES -->
    <div class="stories">
      <div class="story">
        <div class="story-ring">
          <img src="IMAGE/WhatsApp Image 2025-09-27 at 07.35.41_f0ce9212.jpg" alt="your story">
        </div>
        <p>Your story</p>
      </div>
      <div class="story">
        <div class="story-ring">
          <img src="IMAGE/WhatsApp Image 2025-09-27 at 07.35.43_ea7e5c47.jpg" alt="story">
        </div>
        <p>dharshini_siva</p>
      </div>
      <div class="story">
        <div class="story-ring">
          <img src="IMAGE/WhatsApp Image 2025-09-27 at 07.35.43_ed8b6f34.jpg" alt="story">
        </div>
        <p>sathyasree 1805</p>
      </div>
      <div class="story">
        <div class="story-ring">
          <img src="IMAGE/WhatsApp Image 2025-09-25 at 14.42.58_21bd7b70.jpg" alt="story">
        </div>
        <p>itz_me_subu</p>
      </div>
    </div>

    <!-- POST -->
    <div class="post">
      <div class="post-header">
        <div class="profile">
          <img src="IMAGE/WhatsApp Image 2025-09-27 at 07.35.42_3c88c9ba.jpg" alt="profile">
          <div>
            <h4>iasworldofficial <i class="fa-solid fa-circle-check"></i></h4>
            <span>A.R Rahman.chhaava Title Track</span>
          </div>
        </div>
        <i class="fa-solid fa-ellipsis-vertical"></i>
      </div>

      <!-- Post Image -->
      <img src="IMAGE/WhatsApp Image 2025-09-27 at 07.35.41_2f9142cd.jpg" alt="post image" class="post-img">

      <!-- Post Actions -->
      <div class="post-actions">
        <div class="left">
          <i class="fa-regular fa-heart"></i>
          <i class="fa-regular fa-comment"></i>
          <i class="fa-regular fa-paper-plane"></i>
        </div>
        <div class="right">
          <i class="fa-regular fa-bookmark"></i>
        </div>
      </div>

      <!-- Likes & Caption -->
      <div class="post-info">
        <p class="likes">14k likes</p>
        <p class="caption"><strong>iasworldofficial</strong> This is a sample caption text in English.</p>
        <p class="comments">View all 1k</p>
        <p class="time">5 August 2025</p>
      </div>
    </div>

    <!-- BOTTOM NAV -->
    <nav class="bottom-nav">
      <span class="icon"><i class="fa-solid fa-house"></i></span>
      <span class="icon"><i class="fa-solid fa-magnifying-glass"></i></span>
      <span class="icon"><i class="fa-solid fa-square-plus"></i></span>
      <span class="icon"><i class="fa-regular fa-heart"></i></span>
      <span class="icon"><i class="fa-regular fa-user"></i></span>
    </nav>
  </div>
</body>
</html>
